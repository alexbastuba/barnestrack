name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # ffmpeg with libx264 encodes the synthetic clips the video tests use (D35);
      # the tests skip themselves with a message when it is missing.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
