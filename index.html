<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarnesTrack — Barnes maze video analysis</title>
    <meta
      name="description"
      content="Turns Barnes maze videos into auditable behavioral metrics, entirely in your browser."
    />
    <!--
      The same mark the header draws in `logoMark()` (src/ui/app.ts): a Barnes
      platform from above, twelve holes, one of them the target. Inlined as a
      data URI rather than a file, so the page ships no icon asset and the
      network tab stays empty of the stray /favicon.ico the browser would
      otherwise ask for (D2, D41). Chunk 9c-b swaps the final mark in here and
      in `logoMark()`.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%230a4d8c' stroke-width='1.2'%3E%3Ccircle cx='16' cy='16' r='14' stroke-width='2'/%3E%3Ccircle cx='16.00' cy='5.50' r='1.5'/%3E%3Ccircle cx='21.25' cy='6.91' r='1.5'/%3E%3Ccircle cx='25.09' cy='10.75' r='1.5'/%3E%3Ccircle cx='25.09' cy='21.25' r='1.5'/%3E%3Ccircle cx='21.25' cy='25.09' r='1.5'/%3E%3Ccircle cx='16.00' cy='26.50' r='1.5'/%3E%3Ccircle cx='10.75' cy='25.09' r='1.5'/%3E%3Ccircle cx='6.91' cy='21.25' r='1.5'/%3E%3Ccircle cx='5.50' cy='16.00' r='1.5'/%3E%3Ccircle cx='6.91' cy='10.75' r='1.5'/%3E%3Ccircle cx='10.75' cy='6.91' r='1.5'/%3E%3C/g%3E%3Ccircle cx='26.50' cy='16.00' r='2.4' fill='%230a4d8c'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p>
        BarnesTrack needs JavaScript to decode video in your browser. Nothing is uploaded; the
        analysis runs on this machine.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
